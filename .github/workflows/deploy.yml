name: Verify and release PHIGAME
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: phigame-release
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify note physics and delivery
        run: npm test
      - name: Build complete website
        run: npm run build
      - name: Publish tested source revision
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let head = null;
            try { head = (await github.rest.git.getRef({ owner, repo, ref: 'heads/gh-pages' })).data.object.sha; }
            catch (error) { if (error.status !== 404) throw error; }
            const release = JSON.stringify({ source: context.sha, released_at: new Date().toISOString() });
            const tree = (await github.rest.git.createTree({ owner, repo, tree: [{ path: 'release.json', mode: '100644', type: 'blob', content: release }] })).data;
            const commit = (await github.rest.git.createCommit({ owner, repo, message: `Release ${context.sha}`, tree: tree.sha, parents: head ? [head] : [] })).data;
            if (head) await github.rest.git.updateRef({ owner, repo, ref: 'heads/gh-pages', sha: commit.sha });
            else await github.rest.git.createRef({ owner, repo, ref: 'refs/heads/gh-pages', sha: commit.sha });
            await core.summary.addHeading('PHIGAME released').addRaw(`Verified source: ${context.sha}`).write();
